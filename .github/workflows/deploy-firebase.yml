name: Deploy Firebase Production

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'database.rules.json'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

jobs:
  deploy-firebase:
    name: Deploy Functions, Rules & Indexes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Build Backend Functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Production
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BALLHUB != '' }}
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions,firestore,database
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BALLHUB }}

      - name: Check Deployment Credentials Notice
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BALLHUB == '' }}
        run: |
          echo "=========================================================================="
          echo " [THÔNG BÁO] Chưa cấu hình secret FIREBASE_SERVICE_ACCOUNT_BALLHUB!"
          echo " Bước deploy được bỏ qua an toàn."
          echo " Để kích hoạt auto-deploy lên Firebase, vui lòng vào Repository Settings:"
          echo " Settings -> Secrets and variables -> Actions -> Thêm FIREBASE_SERVICE_ACCOUNT_BALLHUB"
          echo "=========================================================================="
